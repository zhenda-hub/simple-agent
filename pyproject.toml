[project]
name = "simple-agent"
version = "0.1.0"
description = "A simple AI agent with tool use and code execution"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.31.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "langgraph>=0.2.74",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
